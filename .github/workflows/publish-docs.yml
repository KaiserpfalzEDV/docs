---
name: Publish to GitHub Pages with Lunr Search Extension
on:
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    - cron: "45 */12 * * *"   # <=== Change this value
concurrency:
  group: github-pages
  cancel-in-progress: false
# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Install Ruby
        uses: actions/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install ruby asciidoctor-pdf
        run: |
          bundle config --local path .bundle/gems
          bundle
          
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
      - name: Install Antora with the Antora Lunr Extension
        run: npm i antora @antora/lunr-extension @antora/pdf-extension asciidoctor-kroki
      - name: Configure git credentials for private content sources
        run: |
          echo "https://x-access-token:${CLUSTER_GITOPS_TOKEN}@github.com" > ~/.git-credentials
        env:
          CLUSTER_GITOPS_TOKEN: ${{ secrets.CLUSTER_GITOPS_TOKEN }}
      - name: Generate Site
        run: npx antora --stacktrace antora-playbook.yml
      - name: Remove git persist-credentials
        run: |
          rm ~/.git-credentials
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5